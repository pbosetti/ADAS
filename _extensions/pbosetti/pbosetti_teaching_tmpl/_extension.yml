title: pbosetti Teaching Template
author: Paolo Bosetti
version: 1.0.1
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      width: 1280
      height: 720
      margin: 0.1
      slide-number: true
      code-line-numbers: true
      code-annotations: below
      preview-links: auto
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
      theme: [default, teaching.scss]
      format-resources:
        - fonts
      include-in-header: fonts.html
      include-after-body: dyslexia-toggle.html
      chalkboard: true
      fig-width: 5
      fig-height: 4
      fig-dpi: 300
      controls: true
      touch: true
      email-obfuscation: javascript
      pdf-separate-fragments: true
      link-external-icon: true
